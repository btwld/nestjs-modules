name: ci-pr-test

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read
  checks: write

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x]
        # The driver's peer range admits both supported TypeORM lines, and only
        # one can be installed at a time — the workspace pins a single instance
        # so decorator metadata cannot split. `lockfile` is 1.0.x; the second
        # leg rewrites the pin to keep 0.3 covered.
        typeorm: [lockfile, '0.3.28']

    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install
        if: matrix.typeorm == 'lockfile'
        run: pnpm install --frozen-lockfile
      - name: Install on TypeORM ${{ matrix.typeorm }}
        if: matrix.typeorm != 'lockfile'
        run: |
          perl -pi -e 's/^(\s*typeorm:) .+$/$1 ^${{ matrix.typeorm }}/ if $. < 100' pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Linting
        run: pnpm lint:all
      - name: Unit tests
        run: pnpm test:ci
      - name: E2E tests
        run: pnpm test:e2e
      - name: Smoke test
        run: pnpm smoke
      # Reporting runs on the lockfile leg only. Both legs run the same tests,
      # so a second upload would collide on the artifact name and double-report
      # the same results against the PR.
      - name: Upload test-results artifact
        uses: actions/upload-artifact@v4
        if: (success() || failure()) && matrix.typeorm == 'lockfile'
        with:
          name: test-results
          path: |
            junit.xml
            coverage/lcov.info
            coverage/coverage-final.json
      - name: Process Test Results
        uses: dorny/test-reporter@v3
        if: (success() || failure()) && matrix.typeorm == 'lockfile'
        with:
          name: Unit Tests
          path: 'junit.xml'
          reporter: java-junit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: (success() || failure()) && matrix.typeorm == 'lockfile' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: ./coverage/coverage-final.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
      - name: Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        if: (success() || failure()) && matrix.typeorm == 'lockfile' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage/lcov.info
