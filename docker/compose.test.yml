# Databases for `pnpm test:docker`. Local only; not used by CI.
name: rockets-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rockets_test
    ports:
      - '55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rockets_test']
      interval: 1s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: rockets_test
    ports:
      - '53306:3306'
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # TCP, so it passes only once the server that init starts with
      # networking off has been replaced by the real one.
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent']
      interval: 1s
      timeout: 3s
      retries: 60
